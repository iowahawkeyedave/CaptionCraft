<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGradient)"/>
  
  <!-- Main image frame with shadow -->
  <rect x="12" y="14" width="26" height="20" rx="3" ry="3" fill="url(#iconGradient)" filter="url(#shadow)"/>
  
  <!-- Image content - mountain landscape -->
  <path d="M15 28 L20 22 L25 25 L30 21 L35 24 V31 H15 Z" fill="#667eea" opacity="0.7"/>
  
  <!-- Sun in the landscape -->
  <circle cx="30" cy="19" r="2.5" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Cloud -->
  <ellipse cx="22" cy="18" rx="2" ry="1.2" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="24" cy="17.5" rx="1.5" ry="1" fill="#ffffff" opacity="0.6"/>
  
  <!-- Caption lines with varying lengths -->
  <rect x="14" y="40" width="22" height="2.5" rx="1.25" fill="url(#iconGradient)" opacity="0.9"/>
  <rect x="14" y="44" width="18" height="2.5" rx="1.25" fill="url(#iconGradient)" opacity="0.7"/>
  <rect x="14" y="48" width="14" height="2.5" rx="1.25" fill="url(#iconGradient)" opacity="0.5"/>
  
  <!-- Craft tool - stylized pen/brush -->
  <path d="M44 16 L48 20 L42 26 L38 22 Z" fill="#fbbf24" opacity="0.9" filter="url(#shadow)"/>
  <circle cx="39" cy="23" r="2" fill="#ef4444" opacity="0.8"/>
  
  <!-- Small sparkles to indicate "craft/magic" -->
  <circle cx="50" cy="12" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="46" cy="10" r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="52" cy="15" r="0.6" fill="#ffffff" opacity="0.7"/>
</svg>